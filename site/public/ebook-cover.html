<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spark, Delta Lake, and Databricks in Production — Book Cover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500&family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #2a2a2e;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    .cover {
      width: 620px;
      height: 930px;
      background: #0F1319;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 25px 60px rgba(0,0,0,0.5),
        0 0 0 1px rgba(255,255,255,0.04);
    }

    /* — Top accent bar — */
    .cover::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #C8963E, #E8B44E, #C8963E);
    }

    /* — Bottom accent bar — */
    .cover::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #C8963E, #E8B44E, #C8963E);
    }

    /* — Subtle background texture — */
    .bg-texture {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(255,255,255,0.015) 1px, transparent 0);
      background-size: 24px 24px;
      pointer-events: none;
    }

    /* — Vertical side accent — */
    .side-accent {
      position: absolute;
      top: 5px;
      left: 0;
      bottom: 5px;
      width: 48px;
      background: linear-gradient(180deg,
        rgba(200, 150, 62, 0.08) 0%,
        rgba(200, 150, 62, 0.03) 40%,
        rgba(200, 150, 62, 0.03) 60%,
        rgba(200, 150, 62, 0.08) 100%
      );
      border-right: 1px solid rgba(200, 150, 62, 0.12);
    }

    .side-accent-text {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: rotate(-90deg) translateX(-50%);
      transform-origin: left center;
      font-family: 'Inter', sans-serif;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(200, 150, 62, 0.4);
      white-space: nowrap;
    }

    /* — Content area — */
    .content {
      position: relative;
      z-index: 1;
      padding: 52px 52px 44px 72px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* — Series / Publisher tag — */
    .series-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(200, 150, 62, 0.7);
      margin-bottom: 36px;
    }

    /* — Title block — */
    .title-block {
      margin-bottom: 20px;
    }

    .title {
      font-family: 'Crimson Pro', Georgia, serif;
      font-weight: 700;
      font-size: 42px;
      line-height: 1.15;
      color: #F0EDE4;
      letter-spacing: -0.3px;
    }

    .title em {
      font-style: normal;
      color: #E2B44C;
    }

    .title-rule {
      width: 56px;
      height: 2px;
      background: linear-gradient(90deg, #C8963E, transparent);
      margin: 20px 0;
    }

    .subtitle {
      font-family: 'Crimson Pro', Georgia, serif;
      font-weight: 400;
      font-style: italic;
      font-size: 19px;
      line-height: 1.45;
      color: rgba(226, 180, 76, 0.85);
      max-width: 380px;
    }

    /* — Illustration area — */
    .illustration {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 16px 0;
      position: relative;
    }

    .illustration svg {
      width: 100%;
      max-width: 480px;
      height: auto;
    }

    /* — Bottom section — */
    .bottom {
      margin-top: auto;
    }

    .bottom-rule {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg,
        rgba(200, 150, 62, 0.3),
        rgba(200, 150, 62, 0.08) 70%,
        transparent
      );
      margin-bottom: 20px;
    }

    .author-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .author {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: #F0EDE4;
    }

    .edition-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(200, 150, 62, 0.65);
    }

    .edition-badge::before {
      content: '';
      display: block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #C8963E;
    }

    /* — Print helper — */
    @media print {
      body { background: none; }
      .cover { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="cover">
    <div class="bg-texture"></div>

    <div class="side-accent">
      <span class="side-accent-text">Production Engineering Series</span>
    </div>

    <div class="content">
      <!-- Series tag -->
      <div class="series-tag">A Practitioner's Guide</div>

      <!-- Title -->
      <div class="title-block">
        <h1 class="title">
          <em>Spark</em>, <em>Delta&nbsp;Lake</em>,<br>
          and <em>Databricks</em><br>
          in Production
        </h1>
        <div class="title-rule"></div>
        <p class="subtitle">Real Problems, Real Fixes, No Theory</p>
      </div>

      <!-- Central Illustration -->
      <div class="illustration">
        <svg viewBox="0 -20 480 330" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="glow-amber" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <filter id="glow-teal" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <filter id="glow-wide" x="-100%" y="-100%" width="300%" height="300%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>

            <linearGradient id="stream-amber" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#C8963E" stop-opacity="0"/>
              <stop offset="25%" stop-color="#C8963E" stop-opacity="0.8"/>
              <stop offset="75%" stop-color="#E2B44C" stop-opacity="0.8"/>
              <stop offset="100%" stop-color="#E2B44C" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="stream-teal" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#2D8E8E" stop-opacity="0"/>
              <stop offset="30%" stop-color="#2D8E8E" stop-opacity="0.7"/>
              <stop offset="70%" stop-color="#3BA8A8" stop-opacity="0.7"/>
              <stop offset="100%" stop-color="#3BA8A8" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="stream-purple" x1="100%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#7C5CBF" stop-opacity="0"/>
              <stop offset="25%" stop-color="#7C5CBF" stop-opacity="0.65"/>
              <stop offset="75%" stop-color="#9B7DD4" stop-opacity="0.65"/>
              <stop offset="100%" stop-color="#9B7DD4" stop-opacity="0"/>
            </linearGradient>

            <!-- Triangle interior fill gradient -->
            <linearGradient id="tri-fill" x1="50%" y1="0%" x2="50%" y2="100%">
              <stop offset="0%" stop-color="#C8963E" stop-opacity="0.04"/>
              <stop offset="50%" stop-color="#2D8E8E" stop-opacity="0.03"/>
              <stop offset="100%" stop-color="#7C5CBF" stop-opacity="0.04"/>
            </linearGradient>

            <radialGradient id="node-amber" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#E8C44E" stop-opacity="1"/>
              <stop offset="50%" stop-color="#C8963E" stop-opacity="0.5"/>
              <stop offset="100%" stop-color="#C8963E" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="node-teal" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#5EC4C4" stop-opacity="1"/>
              <stop offset="50%" stop-color="#2D8E8E" stop-opacity="0.45"/>
              <stop offset="100%" stop-color="#2D8E8E" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="node-purple" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#B69DE0" stop-opacity="1"/>
              <stop offset="50%" stop-color="#7C5CBF" stop-opacity="0.45"/>
              <stop offset="100%" stop-color="#7C5CBF" stop-opacity="0"/>
            </radialGradient>

            <clipPath id="delta-clip">
              <polygon points="240,18 52,278 428,278"/>
            </clipPath>
          </defs>

          <!-- Background coordinate grid -->
          <g opacity="0.045">
            <line x1="60" y1="0" x2="60" y2="310" stroke="#F0EDE4" stroke-width="0.5"/>
            <line x1="120" y1="0" x2="120" y2="310" stroke="#F0EDE4" stroke-width="0.5"/>
            <line x1="180" y1="0" x2="180" y2="310" stroke="#F0EDE4" stroke-width="0.5"/>
            <line x1="240" y1="0" x2="240" y2="310" stroke="#F0EDE4" stroke-width="0.5"/>
            <line x1="300" y1="0" x2="300" y2="310" stroke="#F0EDE4" stroke-width="0.5"/>

            <line x1="420" y1="0" x2="420" y2="310" stroke="#F0EDE4" stroke-width="0.5"/>
            <line x1="0" y1="40" x2="480" y2="40" stroke="#F0EDE4" stroke-width="0.5"/>

            <line x1="0" y1="160" x2="480" y2="160" stroke="#F0EDE4" stroke-width="0.5"/>
            <line x1="0" y1="220" x2="480" y2="220" stroke="#F0EDE4" stroke-width="0.5"/>
            <line x1="0" y1="280" x2="480" y2="280" stroke="#F0EDE4" stroke-width="0.5"/>
          </g>

          <!-- Delta Triangle — subtle interior fill -->
          <polygon points="240,18 52,278 428,278" fill="url(#tri-fill)"/>

          <!-- Delta Triangle — outer frame (doubled for presence) -->
          <polygon points="240,18 52,278 428,278"
            fill="none" stroke="rgba(200,150,62,0.3)" stroke-width="1.5"/>
          <polygon points="240,20 54,277 426,277"
            fill="none" stroke="rgba(200,150,62,0.1)" stroke-width="0.5"/>

          <!-- Topographic contour layers -->
          <g clip-path="url(#delta-clip)">
            <polygon points="240,42 76,264 404,264"
              fill="none" stroke="rgba(200,150,62,0.14)" stroke-width="0.8"/>
            <polygon points="240,68 102,248 378,248"
              fill="none" stroke="rgba(45,142,142,0.18)" stroke-width="0.8"/>

            <!-- Horizontal data layer bands (Bronze / Silver / Gold) -->

            <line x1="115" y1="210" x2="365" y2="210"

            <line x1="158" y1="175" x2="322" y2="175"
              stroke="rgba(200,150,62,0.1)" stroke-width="8" stroke-linecap="round"/>

            <!-- Irregular contour paths -->
            <path d="M 240,55 Q 260,50 280,80 Q 320,130 370,200 Q 400,245 410,260"

          </g>

          <!-- Data streams — LEFT (entering Delta vertex) -->
          <g>
            <path d="M 0,190 Q 18,192 52,278" fill="none" stroke="url(#stream-teal)" stroke-width="1.8"/>
            <path d="M 0,205 Q 22,205 52,278" fill="none" stroke="url(#stream-teal)" stroke-width="1.2" stroke-dasharray="5,5"/>
            <path d="M 0,175 Q 14,180 52,278" fill="none" stroke="url(#stream-teal)" stroke-width="0.8"/>

            <path d="M 0,235 Q 32,232 52,278" fill="none" stroke="url(#stream-teal)" stroke-width="0.4" stroke-dasharray="2,6"/>
            <path d="M 0,145 Q 8,155 52,278" fill="none" stroke="url(#stream-teal)" stroke-width="0.3"/>
          </g>

          <!-- Data streams — TOP (entering Spark vertex) -->
          <g>
            <path d="M 175,0 Q 202,6 240,18" fill="none" stroke="url(#stream-amber)" stroke-width="1.8"/>
            <path d="M 195,0 Q 214,8 240,18" fill="none" stroke="url(#stream-amber)" stroke-width="1.2" stroke-dasharray="5,5"/>
            <path d="M 155,0 Q 192,4 240,18" fill="none" stroke="url(#stream-amber)" stroke-width="0.8"/>
            <path d="M 215,0 Q 224,10 240,18" fill="none" stroke="url(#stream-amber)" stroke-width="0.6" stroke-dasharray="3,7"/>
            <path d="M 270,0 Q 258,6 240,18" fill="none" stroke="url(#stream-amber)" stroke-width="1.5"/>
            <path d="M 295,0 Q 272,5 240,18" fill="none" stroke="url(#stream-amber)" stroke-width="0.9" stroke-dasharray="4,6"/>
            <path d="M 315,0 Q 282,4 240,18" fill="none" stroke="url(#stream-amber)" stroke-width="0.5"/>
            <path d="M 135,0 Q 180,3 240,18" fill="none" stroke="url(#stream-amber)" stroke-width="0.4" stroke-dasharray="2,8"/>
          </g>

          <!-- Data streams — RIGHT (exiting Databricks vertex) -->
          <g>
            <path d="M 428,278 Q 448,272 480,245" fill="none" stroke="url(#stream-purple)" stroke-width="1.8"/>
            <path d="M 428,278 Q 450,278 480,258" fill="none" stroke="url(#stream-purple)" stroke-width="1.2" stroke-dasharray="5,5"/>

            <path d="M 428,278 Q 438,256 480,200" fill="none" stroke="url(#stream-purple)" stroke-width="0.3"/>
          </g>

            <path d="M 60,274 Q 108,215 152,148 Q 178,104 206,62 Q 226,38 240,24"
              fill="none" stroke="rgba(45,142,142,0.15)" stroke-width="0.7" stroke-dasharray="3,5"/>

            <path d="M 240,18 Q 260,38 300,100 Q 340,165 380,225 Q 410,260 428,278"
              fill="none" stroke="rgba(200,150,62,0.3)" stroke-width="1.2" stroke-dasharray="6,4"/>
            <path d="M 240,24 Q 262,44 304,106 Q 342,168 382,228 Q 413,262 426,274"
              fill="none" stroke="rgba(200,150,62,0.15)" stroke-width="0.7" stroke-dasharray="3,5"/>

            <path d="M 52,278 Q 150,265 240,258 Q 330,265 428,278"
              fill="none" stroke="rgba(124,92,191,0.25)" stroke-width="1.2" stroke-dasharray="6,4"/>
            <path d="M 62,274 Q 152,260 240,254 Q 328,260 418,274"
              fill="none" stroke="rgba(124,92,191,0.12)" stroke-width="0.7" stroke-dasharray="3,5"/>

              fill="none" stroke="rgba(200,150,62,0.15)" stroke-width="0.8" stroke-dasharray="4,6"/>

              fill="none" stroke="rgba(45,142,142,0.15)" stroke-width="0.7" stroke-dasharray="3,5"/>

            <line x1="360" y1="240" x2="330" y2="210" stroke="rgba(124,92,191,0.4)" stroke-width="0.5"/>

            <line x1="240" y1="140" x2="270" y2="160" stroke="rgba(200,150,62,0.3)" stroke-width="0.4"/>
          </g>

          <!-- Data nodes — outer ring -->
          <g>
            <circle cx="150" cy="210" r="4" fill="rgba(45,142,142,0.6)"/>
            <circle cx="150" cy="210" r="1.5" fill="rgba(94,196,196,0.8)"/>

          </g>

          <!-- Data nodes — mid ring -->
          <g>
            <circle cx="210" cy="160" r="3.5" fill="rgba(200,150,62,0.55)"/>
            <circle cx="210" cy="160" r="1.2" fill="rgba(232,196,78,0.8)"/>
            <circle cx="270" cy="160" r="3.5" fill="rgba(200,150,62,0.55)"/>
            <circle cx="270" cy="160" r="1.2" fill="rgba(232,196,78,0.8)"/>
            <circle cx="240" cy="200" r="3" fill="rgba(45,142,142,0.5)"/>
            <circle cx="200" cy="230" r="2.5" fill="rgba(124,92,191,0.45)"/>
            <circle cx="280" cy="230" r="2.5" fill="rgba(124,92,191,0.45)"/>
